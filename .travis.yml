language: csharp
mono: none
sudo: required
dist: xenial
dotnet: 3.1.100
branches:
  only:
    - master
    - develop
before_script:
  - chmod -R a+x scripts
script:
  # The cross-origin guards run FIRST and as their own step. They need only
  # `bash` and `awk`, so gating them here rather than inside ./scripts/test.sh
  # keeps the FR-11 regression check independent of the dotnet 3.1 toolchain
  # pinned above — a framework bump can break the build without silently
  # taking the guard offline with it.
  - ./scripts/tests/cors-guard.test.sh
  - ./scripts/verify-cors-config.sh
  - ./scripts/build.sh
  - ./scripts/test.sh
after_success:
  - ./scripts/dockerize.sh
notifications:
  email:
    on_success: never
    on_failure: always
